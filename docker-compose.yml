services:
  postgres_db:
    image: postgres:16-alpine
    container_name: harita_postgres
    restart: always
    environment:
      POSTGRES_USER: harita_user
      POSTGRES_PASSWORD: harita_password_123
      POSTGRES_DB: harita_oyunu_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: harita_backend
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      - DATABASE_URL=postgresql://harita_user:harita_password_123@postgres_db:5432/harita_oyunu_db
    depends_on:
      - postgres_db

volumes:
  postgres_data:
